[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-performance-advisor"
version = "0.1.0"
description = "Personal Performance & Environment Advisor: Garmin + weather/air-quality driven daily and monthly reports."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
